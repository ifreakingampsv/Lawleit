# Lawleit API on Fly.io — Mumbai region next to the Supabase database (ADR-0004).
app = "lawleit-api"
primary_region = "bom"

[build]

[http_service]
internal_port = 3001
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0

[http_service.checks]
[http_service.checks.health]
type = "http"
path = "/health"
interval = "30s"
timeout = "5s"
grace_period = "15s"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
